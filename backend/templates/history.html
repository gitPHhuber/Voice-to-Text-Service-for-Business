<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASVO — История</title>
<style>
  :root {
    --bg: #2d2d3f;
    --bg-dark: #252536;
    --shadow-dark: #1a1a2e;
    --shadow-light: #3d3d55;
    --accent: #7c6cf0;
    --accent-light: #9d8ff7;
    --accent-glow: rgba(124, 108, 240, 0.25);
    --text: #e0dff0;
    --text-dim: #8a89a8;
    --text-muted: #6b6a85;
    --radius: 20px;
    --radius-sm: 14px;
    --radius-xs: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Neumorphic mixins via classes */
  .neu-raised {
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow:
      8px 8px 16px var(--shadow-dark),
      -8px -8px 16px var(--shadow-light);
  }

  .neu-inset {
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow:
      inset 4px 4px 8px var(--shadow-dark),
      inset -4px -4px 8px var(--shadow-light);
  }

  /* Header */
  .header {
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    background: var(--bg);
    box-shadow: 0 4px 12px var(--shadow-dark);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--accent-light);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--radius-xs);
    background: var(--bg);
    box-shadow:
      4px 4px 8px var(--shadow-dark),
      -4px -4px 8px var(--shadow-light);
    transition: all 0.25s ease;
  }

  .header .back-link:hover {
    box-shadow:
      inset 3px 3px 6px var(--shadow-dark),
      inset -3px -3px 6px var(--shadow-light);
    color: var(--accent);
  }

  .header .back-link svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .header h1 {
    color: var(--accent-light);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-shadow: 0 0 20px var(--accent-glow);
  }

  /* Content */
  .content {
    max-width: 920px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
  }

  /* Search */
  .search-wrap {
    padding: 14px 18px;
    margin-bottom: 2rem;
  }

  .search-wrap input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
  }

  .search-wrap input::placeholder {
    color: var(--text-muted);
  }

  /* Search results */
  .search-results {
    margin-bottom: 2rem;
  }

  .search-results-title {
    color: var(--accent-light);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
    padding-left: 4px;
  }

  .search-seg {
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    box-shadow:
      inset 3px 3px 6px var(--shadow-dark),
      inset -3px -3px 6px var(--shadow-light);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .search-seg a {
    color: var(--accent-light);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
  }

  .search-seg a:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .search-seg .speaker-name {
    color: var(--text-muted);
    margin-left: 0.25rem;
  }

  .search-seg mark {
    background: rgba(124, 108, 240, 0.3);
    color: #d4ccff;
    border-radius: 3px;
    padding: 1px 3px;
  }

  /* Transcript cards */
  .card {
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent-light));
    border-radius: 4px 0 0 4px;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      10px 10px 20px var(--shadow-dark),
      -10px -10px 20px var(--shadow-light);
  }

  .card-title {
    font-weight: 700;
    color: var(--text);
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }

  .card-meta {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 0.4rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
  }

  .card-meta .tag {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--bg-dark);
    box-shadow:
      inset 2px 2px 4px var(--shadow-dark),
      inset -2px -2px 4px var(--shadow-light);
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .card-summary {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 0.6rem;
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-actions {
    margin-top: 0.85rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .card-actions a {
    color: var(--accent-light);
    font-size: 0.82rem;
    font-weight: 500;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: var(--radius-xs);
    background: var(--bg);
    box-shadow:
      3px 3px 6px var(--shadow-dark),
      -3px -3px 6px var(--shadow-light);
    transition: all 0.2s ease;
  }

  .card-actions a:hover {
    box-shadow:
      inset 3px 3px 6px var(--shadow-dark),
      inset -3px -3px 6px var(--shadow-light);
    color: var(--accent);
  }

  .card-actions a.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    box-shadow:
      3px 3px 6px var(--shadow-dark),
      -3px -3px 6px var(--shadow-light),
      0 0 12px var(--accent-glow);
    font-weight: 600;
  }

  .card-actions a.primary:hover {
    box-shadow:
      inset 3px 3px 6px rgba(100, 80, 200, 0.3),
      inset -3px -3px 6px rgba(180, 160, 255, 0.15),
      0 0 16px var(--accent-glow);
  }

  /* Empty state */
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 4rem 2rem;
    font-size: 1.05rem;
  }

  .empty-icon {
    font-size: 2.5rem;
    margin-bottom: 0.75rem;
    opacity: 0.4;
  }

  /* Loading spinner */
  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }

  .loading::after {
    content: '';
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid var(--shadow-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 640px) {
    .content { padding: 1.25rem 1rem 3rem; }
    .header { padding: 1rem 1.25rem; }
    .card { padding: 1.1rem; }
    .card-actions a { padding: 5px 10px; font-size: 0.78rem; }
  }
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Главная
  </a>
  <h1>История транскриптов</h1>
</div>
<div class="content">
  <div class="search-wrap neu-inset">
    <input id="searchBox" placeholder="Поиск по транскриптам..." oninput="debounceSearch()">
  </div>
  <div id="searchResults" class="search-results"></div>
  <div id="list">
    <div class="loading">Загрузка</div>
  </div>
</div>

<script>
let searchTimer;

function debounceSearch() {
  clearTimeout(searchTimer);
  const q = document.getElementById('searchBox').value.trim();
  if (!q) {
    document.getElementById('searchResults').innerHTML = '';
    return;
  }
  searchTimer = setTimeout(() => doSearch(q), 400);
}

async function doSearch(q) {
  const el = document.getElementById('searchResults');
  try {
    const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=10`);
    const data = await resp.json();
    if (!data.results.length) {
      el.innerHTML = '<div class="empty">Ничего не найдено</div>';
      return;
    }
    el.innerHTML =
      '<div class="search-results-title">Результаты поиска</div>' +
      data.results.map(r =>
        `<div class="search-seg">
          <a href="/view/${r.task_id}">${escHtml(r.title || r.task_id)}</a>
          <span class="speaker-name">${escHtml(r.speaker)}:</span>
          ${r.snippet || escHtml(r.text)}
        </div>`
      ).join('');
  } catch(e) {
    el.innerHTML = '';
  }
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function truncate(text, max) {
  if (!text) return '';
  return text.length > max ? text.substring(0, max) + '...' : text;
}

async function loadHistory() {
  const el = document.getElementById('list');
  try {
    const resp = await fetch('/api/transcripts?limit=50');
    const data = await resp.json();
    if (!data.transcripts.length) {
      el.innerHTML = `
        <div class="empty">
          <div class="empty-icon">&#128196;</div>
          Пока нет транскриптов
        </div>`;
      return;
    }
    el.innerHTML = data.transcripts.map(t => {
      const dur = t.duration ? `${(t.duration / 60).toFixed(0)} мин` : '';
      const spk = (t.speakers || []).length;
      const date = t.created_at ? t.created_at.substring(0, 10) : '';
      const lang = t.language || '';
      const title = escHtml(t.title || t.file_name || t.task_id);
      const summary = t.summary ? `<div class="card-summary">${escHtml(truncate(t.summary, 180))}</div>` : '';

      return `<div class="card neu-raised">
        <div class="card-title">${title}</div>
        <div class="card-meta">
          ${date ? `<span class="tag">${date}</span>` : ''}
          ${dur ? `<span class="tag">${dur}</span>` : ''}
          ${spk ? `<span class="tag">${spk} спикеров</span>` : ''}
          ${lang ? `<span class="tag">${lang}</span>` : ''}
        </div>
        ${summary}
        <div class="card-actions">
          <a href="/view/${t.task_id}" class="primary">Открыть</a>
          <a href="/api/result/${t.task_id}/docx" download>DOCX</a>
          <a href="/api/result/${t.task_id}/txt" download>TXT</a>
          <a href="/api/result/${t.task_id}/srt" download>SRT</a>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty">Ошибка загрузки: ${escHtml(e.message)}</div>`;
  }
}

loadHistory();
</script>
</body>
</html>
